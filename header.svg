<svg width="100%" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f16"/>
      <stop offset="100%" stop-color="#111c2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C7B7"/>
      <stop offset="100%" stop-color="#1e4078"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00C7B7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00C7B7" stop-opacity="0"/>
    </radialGradient>
    <style>
      .blip   { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
      .scan   { animation: scan 3.6s linear infinite; }
      @keyframes scan { from { stroke-dashoffset: 240; } to { stroke-dashoffset: 0; } }
      .commit { animation: fadein 0.5s ease forwards; opacity: 0; }
      @keyframes fadein { to { opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="220" fill="url(#bg)"/>
  <rect width="1200" height="220" fill="url(#glow)"/>

  <g stroke="#1e4078" stroke-width="1" opacity="0.35">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <path d="M900,0 L900,60 L960,60 L960,220" fill="none"/>
    <path d="M1050,0 L1050,90 L1120,90 L1120,220" fill="none"/>
  </g>

  <g transform="translate(60, -20) scale(1.3)" stroke="#8b949e" stroke-width="1.5" fill="none" opacity="0.08">
    <path d="M70,80 Q70,30 120,30 Q170,30 170,80 L170,140 Q170,170 120,170 Q70,170 70,140 Z"/>
    <circle cx="100" cy="85" r="14"/>
    <circle cx="140" cy="85" r="14"/>
    <line x1="114" y1="85" x2="126" y2="85"/>
    <path d="M120,155 L105,185 L120,195 L135,185 Z"/>
    <path d="M100,160 Q120,170 140,160"/>
    <path d="M70,140 C30,150 15,190 15,230 L225,230 C225,190 210,150 170,140"/>
    <path d="M15,230 L15,250 L225,250 L225,230"/>
  </g>

  <g transform="translate(680, 20) scale(1.3)" stroke="#8b949e" stroke-width="2" fill="none" opacity="0.08">
    <g stroke-width="1.5">
      <rect x="100" y="20" width="30" height="30"/>
      <line x1="110" y1="20" x2="110" y2="50"/>
      <line x1="120" y1="20" x2="120" y2="50"/>
      <rect x="70" y="50" width="30" height="30"/>
      <line x1="80" y1="50" x2="80" y2="80"/>
      <line x1="90" y1="50" x2="90" y2="80"/>
      <rect x="100" y="50" width="30" height="30"/>
      <line x1="110" y1="50" x2="110" y2="80"/>
      <line x1="120" y1="50" x2="120" y2="80"/>
      <rect x="130" y="50" width="30" height="30"/>
      <line x1="140" y1="50" x2="140" y2="80"/>
      <line x1="150" y1="50" x2="150" y2="80"/>
      <rect x="40" y="80" width="30" height="30"/>
      <line x1="50" y1="80" x2="50" y2="110"/>
      <line x1="60" y1="80" x2="60" y2="110"/>
      <rect x="70" y="80" width="30" height="30"/>
      <line x1="80" y1="80" x2="80" y2="110"/>
      <line x1="90" y1="80" x2="90" y2="110"/>
      <rect x="100" y="80" width="30" height="30"/>
      <line x1="110" y1="80" x2="110" y2="110"/>
      <line x1="120" y1="80" x2="120" y2="110"/>
      <rect x="130" y="80" width="30" height="30"/>
      <line x1="140" y1="80" x2="140" y2="110"/>
      <line x1="150" y1="80" x2="150" y2="110"/>
      <rect x="160" y="80" width="30" height="30"/>
      <line x1="170" y1="80" x2="170" y2="110"/>
      <line x1="180" y1="80" x2="180" y2="110"/>
    </g>
    <path d="M20,110 Q10,150 90,160 Q170,170 230,120 Q270,80 290,30 Q250,70 220,80 Q190,90 170,110 Z"/>
    <circle cx="210" cy="115" r="4"/>
  </g>

  <text x="60" y="100" font-size="46" font-weight="700" fill="#e6edf3">
    Rajat Bansal
  </text>

  <text x="60" y="140" font-size="20" fill="#00C7B7">
    DevOps &amp; Full-Stack Developer <tspan fill="#6e7681">·</tspan> Building the Web
  </text>

  <rect x="60" y="155" width="300" height="4" rx="2" fill="url(#accent)"/>

  <text x="60" y="185" font-size="14" fill="#8b949e">
    AWS · GCP · Docker · Jenkins · CI/CD
  </text>

  <g transform="translate(890,44)">
    <rect x="0" y="0" width="260" height="132" rx="8" fill="#0f1720" stroke="#1e4078" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="24" rx="8" fill="#161b22"/>
    <rect x="0" y="12" width="260" height="12" fill="#161b22"/>
    <circle cx="14" cy="12" r="4" fill="#ff5f56"/>
    <circle cx="28" cy="12" r="4" fill="#ffbd2e"/>
    <circle cx="42" cy="12" r="4" fill="#27c93f"/>
    <text x="130" y="16" text-anchor="middle" font-size="9" fill="#6e7681">prod · us-east-1</text>

    <circle cx="16" cy="42" r="4" fill="#3fb950" class="blip"/>
    <text x="28" y="46" font-size="12" fill="#c9d1d9">web-frontend</text>
    <text x="220" y="46" font-size="11" fill="#3fb950" text-anchor="end">up</text>

    <circle cx="16" cy="64" r="4" fill="#3fb950" class="blip" style="animation-delay:0.4s"/>
    <text x="28" y="68" font-size="12" fill="#c9d1d9">api-gateway</text>
    <text x="220" y="68" font-size="11" fill="#3fb950" text-anchor="end">up</text>

    <circle cx="16" cy="86" r="4" fill="#3fb950" class="blip" style="animation-delay:0.8s"/>
    <text x="28" y="90" font-size="12" fill="#c9d1d9">database-cluster</text>
    <text x="220" y="90" font-size="11" fill="#3fb950" text-anchor="end">up</text>

    <polyline points="10,112 40,112 50,100 60,120 70,108 80,112 250,112"
              fill="none" stroke="#00C7B7" stroke-width="1.5"
              stroke-dasharray="6 4" class="scan"/>
  </g>

  <g transform="translate(60,200)" font-size="11" fill="#6e7681">
    <text x="0" y="0" class="commit" style="animation-delay:0.2s">$ git log --oneline -3</text>
    <text x="230" y="0" class="commit" style="animation-delay:0.9s" fill="#00C7B7">a1c9e2f</text>
    <text x="300" y="0" class="commit" style="animation-delay:0.9s">feat: add full-stack dashboard</text>
    <text x="620" y="0" class="commit" style="animation-delay:1.6s" fill="#00C7B7">7f3b0d1</text>
    <text x="690" y="0" class="commit" style="animation-delay:1.6s">chore: optimize ci/cd pipeline</text>
  </g>
</svg>
