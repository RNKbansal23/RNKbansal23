<svg width="100%" height="500" viewBox="0 0 950 500" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f16"/>
      <stop offset="100%" stop-color="#111c2b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C7B7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00C7B7" stop-opacity="0"/>
    </radialGradient>
    <g id="hex-check">
      <polygon points="0,5 3,0 9,0 12,5 9,10 3,10" fill-opacity="0.2" stroke-width="1.2"/>
      <polyline points="3.5,5.5 5.5,7.5 9,3" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <style>
      .blip { animation: pulse 2s ease-in-out infinite; }
      .blip-delay { animation: pulse 2s ease-in-out infinite; animation-delay: 1s; }
      @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
      .scanline { animation: scan 4s linear infinite; }
      @keyframes scan { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    </style>
  </defs>

  <rect width="950" height="500" fill="url(#bg)"/>
  <rect width="950" height="500" fill="url(#glow)"/>

  <g stroke="#00C7B7" stroke-width="1.2" fill="none" opacity="0.15">
    <path d="M0,160 L30,160 L50,180 L50,430 L70,450 L250,450"/>
    <circle cx="250" cy="450" r="3" fill="#00C7B7"/>
    <path d="M950,230 L900,230 L880,250 L880,440 L850,470"/>
    <circle cx="850" cy="470" r="3" fill="#00C7B7"/>
    <path d="M300,0 L300,30 L320,50 L500,50 L520,70 L520,130"/>
    <circle cx="520" cy="130" r="3" fill="#00C7B7"/>
    <path d="M600,500 L600,450 L620,430 L750,430 L770,410 L770,360"/>
    <circle cx="770" cy="360" r="3" fill="#00C7B7"/>
    <path d="M100,0 L100,20 L120,40 L250,40"/>
    <circle cx="250" cy="40" r="3" fill="#00C7B7"/>
  </g>

  <text x="50" y="45" font-size="22" font-weight="700" fill="#e6edf3">
    $ <tspan fill="#00C7B7">sys.get_stack</tspan> --current
  </text>

  <g transform="translate(800, 30)">
    <polyline points="0,15 15,15 25,5 35,25 45,15 65,15" fill="none" stroke="#00C7B7" stroke-width="1.5" stroke-dasharray="3 2" class="scanline"/>
    <circle cx="65" cy="15" r="2.5" fill="#00C7B7" class="blip"/>
  </g>

  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="270" height="154" rx="6" fill="#0f1720" stroke="#1e4078" stroke-width="1.5"/>
    <rect x="1" y="1" width="268" height="34" fill="#161b22" rx="6"/>
    <rect x="1" y="25" width="268" height="10" fill="#161b22"/>
    <line x1="0" y1="35" x2="270" y2="35" stroke="#1e4078" stroke-width="1.5"/>
    <text x="15" y="23" font-size="14" font-weight="700" fill="#00C7B7">Languages</text>
    
    <use href="#hex-check" x="14" y="50" fill="#007396" stroke="#007396"/>
    <text x="38" y="59" fill="#c9d1d9" font-size="13">Java</text>
    
    <use href="#hex-check" x="14" y="76" fill="#F7DF1E" stroke="#F7DF1E" class="blip-delay"/>
    <text x="38" y="85" fill="#c9d1d9" font-size="13">JavaScript</text>
    
    <use href="#hex-check" x="14" y="102" fill="#E34F26" stroke="#E34F26"/>
    <text x="38" y="111" fill="#c9d1d9" font-size="13">HTML &amp; CSS</text>
    
    <use href="#hex-check" x="14" y="128" fill="#4479A1" stroke="#4479A1"/>
    <text x="38" y="137" fill="#c9d1d9" font-size="13">SQL</text>
  </g>

  <g transform="translate(50, 270)">
    <rect x="0" y="0" width="270" height="128" rx="6" fill="#0f1720" stroke="#1e4078" stroke-width="1.5"/>
    <rect x="1" y="1" width="268" height="34" fill="#161b22" rx="6"/>
    <rect x="1" y="25" width="268" height="10" fill="#161b22"/>
    <line x1="0" y1="35" x2="270" y2="35" stroke="#1e4078" stroke-width="1.5"/>
    <text x="15" y="23" font-size="14" font-weight="700" fill="#00C7B7">Frontend</text>
    
    <use href="#hex-check" x="14" y="50" fill="#61DAFB" stroke="#61DAFB" class="blip"/>
    <text x="38" y="59" fill="#c9d1d9" font-size="13">React.js</text>
    
    <use href="#hex-check" x="14" y="76" fill="#FFFFFF" stroke="#FFFFFF"/>
    <text x="38" y="85" fill="#c9d1d9" font-size="13">Next.js</text>
    
    <use href="#hex-check" x="14" y="102" fill="#06B6D4" stroke="#06B6D4"/>
    <text x="38" y="111" fill="#c9d1d9" font-size="13">TailwindCSS</text>
  </g>

  <g transform="translate(340, 70)">
    <rect x="0" y="0" width="270" height="128" rx="6" fill="#0f1720" stroke="#1e4078" stroke-width="1.5"/>
    <rect x="1" y="1" width="268" height="34" fill="#161b22" rx="6"/>
    <rect x="1" y="25" width="268" height="10" fill="#161b22"/>
    <line x1="0" y1="35" x2="270" y2="35" stroke="#1e4078" stroke-width="1.5"/>
    <text x="15" y="23" font-size="14" font-weight="700" fill="#00C7B7">Backend</text>
    
    <use href="#hex-check" x="14" y="50" fill="#339933" stroke="#339933"/>
    <text x="38" y="59" fill="#c9d1d9" font-size="13">Node.js</text>
    
    <use href="#hex-check" x="14" y="76" fill="#00C7B7" stroke="#00C7B7" class="blip-delay"/>
    <text x="38" y="85" fill="#c9d1d9" font-size="13">RESTful APIs</text>
    
    <use href="#hex-check" x="14" y="102" fill="#5A67D8" stroke="#5A67D8"/>
    <text x="38" y="111" fill="#c9d1d9" font-size="13">Prisma</text>
  </g>

  <g transform="translate(340, 244)">
    <rect x="0" y="0" width="270" height="128" rx="6" fill="#0f1720" stroke="#1e4078" stroke-width="1.5"/>
    <rect x="1" y="1" width="268" height="34" fill="#161b22" rx="6"/>
    <rect x="1" y="25" width="268" height="10" fill="#161b22"/>
    <line x1="0" y1="35" x2="270" y2="35" stroke="#1e4078" stroke-width="1.5"/>
    <text x="15" y="23" font-size="14" font-weight="700" fill="#00C7B7">Databases</text>
    
    <use href="#hex-check" x="14" y="50" fill="#47A248" stroke="#47A248"/>
    <text x="38" y="59" fill="#c9d1d9" font-size="13">MongoDB</text>
    
    <use href="#hex-check" x="14" y="76" fill="#4479A1" stroke="#4479A1"/>
    <text x="38" y="85" fill="#c9d1d9" font-size="13">MySQL</text>
    
    <use href="#hex-check" x="14" y="102" fill="#336791" stroke="#336791"/>
    <text x="38" y="111" fill="#c9d1d9" font-size="13">PostgreSQL</text>
  </g>

  <g transform="translate(630, 70)">
    <rect x="0" y="0" width="270" height="154" rx="6" fill="#0f1720" stroke="#1e4078" stroke-width="1.5"/>
    <rect x="1" y="1" width="268" height="34" fill="#161b22" rx="6"/>
    <rect x="1" y="25" width="268" height="10" fill="#161b22"/>
    <line x1="0" y1="35" x2="270" y2="35" stroke="#1e4078" stroke-width="1.5"/>
    <text x="15" y="23" font-size="14" font-weight="700" fill="#00C7B7">Cloud</text>
    
    <use href="#hex-check" x="14" y="50" fill="#FF9900" stroke="#FF9900" class="blip"/>
    <text x="38" y="59" fill="#c9d1d9" font-size="13">AWS</text>
    
    <use href="#hex-check" x="14" y="76" fill="#FF9900" stroke="#FF9900"/>
    <text x="38" y="85" fill="#c9d1d9" font-size="13">Amazon EC2</text>
    
    <use href="#hex-check" x="14" y="102" fill="#569A31" stroke="#569A31"/>
    <text x="38" y="111" fill="#c9d1d9" font-size="13">Amazon S3</text>
    
    <use href="#hex-check" x="14" y="128" fill="#527FFF" stroke="#527FFF"/>
    <text x="38" y="137" fill="#c9d1d9" font-size="13">Amazon RDS</text>
  </g>

  <g transform="translate(630, 270)">
    <rect x="0" y="0" width="270" height="154" rx="6" fill="#0f1720" stroke="#1e4078" stroke-width="1.5"/>
    <rect x="1" y="1" width="268" height="34" fill="#161b22" rx="6"/>
    <rect x="1" y="25" width="268" height="10" fill="#161b22"/>
    <line x1="0" y1="35" x2="270" y2="35" stroke="#1e4078" stroke-width="1.5"/>
    <text x="15" y="23" font-size="14" font-weight="700" fill="#00C7B7">Tools</text>
    
    <use href="#hex-check" x="14" y="50" fill="#FFFFFF" stroke="#FFFFFF"/>
    <text x="38" y="59" fill="#c9d1d9" font-size="13">Git</text>
    
    <use href="#hex-check" x="14" y="76" fill="#FFFFFF" stroke="#FFFFFF"/>
    <text x="38" y="85" fill="#c9d1d9" font-size="13">GitHub</text>
    
    <use href="#hex-check" x="14" y="102" fill="#2496ED" stroke="#2496ED" class="blip-delay"/>
    <text x="38" y="111" fill="#c9d1d9" font-size="13">Docker</text>
    
    <use href="#hex-check" x="14" y="128" fill="#FF6C37" stroke="#FF6C37"/>
    <text x="38" y="137" fill="#c9d1d9" font-size="13">Postman</text>
  </g>
</svg>
