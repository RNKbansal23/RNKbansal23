name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
          USERNAME: ${{ github.repository_owner }}
          
      - name: Apply Cyber-Teal Theme
        run: |
          # Brighten base backgrounds so it's less dark/vignetted
          sed -i 's/#161b22/#111c2b/gI' profile-3d-contrib/profile-night-green.svg
          sed -i 's/#0d1117/#111c2b/gI' profile-3d-contrib/profile-night-green.svg
          sed -i 's/#010409/#111c2b/gI' profile-3d-contrib/profile-night-green.svg
          
          # Adjust teal highlights and block colors
          sed -i 's/#39d353/#00FFFF/gI' profile-3d-contrib/profile-night-green.svg
          sed -i 's/#26a641/#00C7B7/gI' profile-3d-contrib/profile-night-green.svg
          sed -i 's/#006d32/#008A80/gI' profile-3d-contrib/profile-night-green.svg
          sed -i 's/#0e4429/#004D47/gI' profile-3d-contrib/profile-night-green.svg
          
          # Inject a much softer, brighter ambient glow (less vignette)
          sed -i 's|</svg>|<defs><radialGradient id="soft-glow" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#00C7B7" stop-opacity="0.08"/><stop offset="100%" stop-color="#111c2b" stop-opacity="0"/></radialGradient></defs><rect width="100%" height="100%" fill="url(#soft-glow)" pointer-events="none"/></svg>|g' profile-3d-contrib/profile-night-green.svg          
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -m "update cyber-teal 3D graph" || exit 0
          git push
