name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
          USERNAME: ${{ github.repository_owner }}
          
      - name: Apply Cyber-Teal Theme
        run: |
          sed -i 's/#0d1117/#0a0f16/g' profile-3d-contrib/profile-night-green.svg
          sed -i 's/#161b22/#0f1720/g' profile-3d-contrib/profile-night-green.svg
          sed -i 's/#39d353/#00FFFF/g' profile-3d-contrib/profile-night-green.svg
          sed -i 's/#26a641/#00C7B7/g' profile-3d-contrib/profile-night-green.svg
          sed -i 's/#006d32/#008A80/g' profile-3d-contrib/profile-night-green.svg
          sed -i 's/#0e4429/#004D47/g' profile-3d-contrib/profile-night-green.svg
          
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -m "chore: update cyber-teal 3D graph" || exit 0
          git push
